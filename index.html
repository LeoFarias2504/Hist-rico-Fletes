<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freddo Comex - Smart Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <nav class="bg-[#003366] text-white p-4 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-widest italic">FREDDO <span class="text-blue-400">LOGÍSTICA</span></h1>
            <div class="flex gap-4 text-xl">
                <i class="fas fa-ship" title="Marítimo"></i>
                <i class="fas fa-truck" title="Terrestre"></i>
                <i class="fas fa-plane" title="Aéreo"></i>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-3xl shadow-2xl border-b-8 border-blue-600">
                <h2 class="text-[#003366] font-black uppercase text-sm mb-6 flex items-center gap-2">
                    <i class="fas fa-file-invoice-dollar"></i> Cargar Flete
                </h2>
                <form id="formComex" class="space-y-4">
                    <input type="text" name="referencia" placeholder="Ref. Expo" class="w-full p-3 bg-gray-50 border-none rounded-xl text-sm outline-blue-500" required>
                    <input type="text" name="destino" placeholder="Destino" class="w-full p-3 bg-gray-50 border-none rounded-xl text-sm outline-blue-500" required>
                    
                    <select name="modalidad" class="w-full p-3 bg-gray-50 border-none rounded-xl text-sm">
                        <option value="Marítimo">🚢 Marítimo</option>
                        <option value="Terrestre">🚛 Terrestre</option>
                        <option value="Aéreo">✈️ Aéreo</option>
                    </select>

                    <input type="text" name="carrier" placeholder="Carrier / Naviera" class="w-full p-3 bg-gray-50 border-none rounded-xl text-sm" required>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" name="flete" placeholder="Flete USD" class="p-3 bg-gray-50 border-none rounded-xl text-sm" required>
                        <input type="number" name="gastos_locales" placeholder="Gastos USD" class="p-3 bg-gray-50 border-none rounded-xl text-sm" required>
                    </div>

                    <button type="submit" class="w-full bg-[#003366] text-white font-bold py-4 rounded-2xl hover:bg-blue-800 transition shadow-lg">
                        GUARDAR Y ACTUALIZAR
                    </button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-md flex items-center justify-between border-l-8 border-blue-500">
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase">Promedio Flete</p>
                        <h3 class="text-2xl font-black text-gray-800" id="kpiAvg">$0</h3>
                    </div>
                    <i class="fas fa-chart-line text-blue-100 text-4xl"></i>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-md flex items-center justify-between border-l-8 border-green-500">
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase">Operaciones</p>
                        <h3 class="text-2xl font-black text-gray-800" id="kpiTotal">0</h3>
                    </div>
                    <i class="fas fa-boxes-stacked text-green-100 text-4xl"></i>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-md flex items-center justify-between border-l-8 border-orange-500">
                    <div>
                        <p class="text-gray-400 text-xs font-bold uppercase">Eficiencia</p>
                        <h3 class="text-2xl font-black text-gray-800">COMEX</h3>
                    </div>
                    <i class="fas fa-globe-americas text-orange-100 text-4xl"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-3xl shadow-lg">
                    <h4 class="text-gray-500 font-bold text-xs uppercase mb-6 tracking-widest flex items-center gap-2">
                        <i class="fas fa-map-location-dot text-blue-500"></i> Costos por Destino
                    </h4>
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-lg">
                    <h4 class="text-gray-500 font-bold text-xs uppercase mb-6 tracking-widest flex items-center gap-2">
                        <i class="fas fa-truck-fast text-blue-500"></i> Mix de Modalidad
                    </h4>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        const url = 'TU_URL_DE_APPS_SCRIPT_AQUI';

        // CARGAR DATOS REALES AL INICIAR
        async function loadData() {
            const res = await fetch(url);
            const data = await res.json();
            
            const total = data.length;
            const avg = data.reduce((acc, row) => acc + (row[8] || 0), 0) / total;

            document.getElementById('kpiTotal').innerText = total;
            document.getElementById('kpiAvg').innerText = '$' + avg.toFixed(2);

            // Actualizar Gráfico de Barras (Destinos)
            const destinos = [...new Set(data.map(d => d[2]))];
            const fletes = destinos.map(dest => {
                const filtrados = data.filter(d => d[2] === dest);
                return filtrados.reduce((acc, d) => acc + d[8], 0) / filtrados.length;
            });

            new Chart(document.getElementById('mainChart'), {
                type: 'bar',
                data: { labels: destinos, datasets: [{ label: 'Promedio USD', data: fletes, backgroundColor: '#3b82f6' }] }
            });

            // Actualizar Gráfico Circular (Modalidad)
            const mods = ['Marítimo', 'Terrestre', 'Aéreo'];
            const counts = mods.map(m => data.filter(d => d[3] === m).length);

            new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: { labels: mods, datasets: [{ data: counts, backgroundColor: ['#003366', '#3b82f6', '#93c5fd'] }] }
            });
        }

        // ENVIAR DATOS
        document.getElementById('formComex').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'PROCESANDO...';
            
            await fetch(url, { method: 'POST', body: new FormData(e.target) });
            
            alert('¡Cotización guardada!');
            location.reload(); // Recarga para ver los nuevos gráficos
        });

        loadData();
    </script>
</body>
</html>
